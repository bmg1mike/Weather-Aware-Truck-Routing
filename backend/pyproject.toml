[project]
name = "truck-routing-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "gunicorn>=27.0.1",
    "httpx>=0.28.1",
    "redis>=8.2.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["^manage\\.py$", "^scripts/"]

[[tool.mypy.overrides]]
module = "trips.tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.django-stubs]
django_settings_module = "config.test_settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
testpaths = ["trips/tests"]
addopts = "-q"
